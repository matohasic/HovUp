name: Nightly Windows build

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install PySide6 pywin32 psutil pywinauto pyinstaller

      - name: Build executable
        run: pyinstaller --noconfirm --clean --onefile --windowed --name Peekaboo src\application.py

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: Peekaboo-windows-x64
          path: dist/Peekaboo.exe
          if-no-files-found: error
          retention-days: 7
