name: Peekaboo Windows builds

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: read
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install PySide6 pywin32 psutil pywinauto pyinstaller

      - name: Build executable
        run: pyinstaller --noconfirm --clean --onefile --windowed --name Peekaboo --icon=assets\peekaboo.ico --add-data "assets\peekaboo.ico;assets" src\application.py

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: Peekaboo-windows-x64
          path: dist/Peekaboo.exe
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download executable
        uses: actions/download-artifact@v4
        with:
          name: Peekaboo-windows-x64
          path: dist

      - name: Update latest release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view latest >/dev/null 2>&1; then
            gh release create latest \
              --title "Latest build" \
              --notes "Automatically updated Peekaboo build." \
              --prerelease \
              --target "$GITHUB_SHA" \
              || gh release view latest >/dev/null
          fi
          gh release upload latest dist/Peekaboo.exe --clobber
